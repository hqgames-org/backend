version = 5.8.0
archive_dir = /etc/letsencrypt/archive/hqgames.freeddns.org
cert = /etc/letsencrypt/live/hqgames.freeddns.org/cert.pem
privkey = /etc/letsencrypt/live/hqgames.freeddns.org/privkey.pem
chain = /etc/letsencrypt/live/hqgames.freeddns.org/chain.pem
fullchain = /etc/letsencrypt/live/hqgames.freeddns.org/fullchain.pem
[renewalparams]
account = b2ac7b17ca46a3dcb04944a07c140f7c
pref_challs = dns-01,
post_hook = '''chown root:33 /etc/letsencrypt/live /etc/letsencrypt/archive \
  && chmod 710 /etc/letsencrypt/live /etc/letsencrypt/archive \
  && chown root:33 /etc/letsencrypt/archive/hqgames.freeddns.org/privkey*.pem \
  && chmod 640 /etc/letsencrypt/archive/hqgames.freeddns.org/privkey*.pem'''
authenticator = dns-dynu
dns_dynu_credentials = /root/dynu-credentials.ini
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
